  #     - 8080:80

  # Gateway module in backlog for today
  cd-gate:
    image: "node:22"
    depends_on:
      db:
        condition: service_started
      db-users:
        condition: service_started
      mongo:
        condition: service_started
    container_name: cd-gate
    working_dir: /home/node/app
    volumes:
      - ./gate:/home/node/app
    expose:
      - "8081"
    links:
      - mongo
      # - redis
      - cd-auth
    command: npm run start:dev
    environment:
      MONGOLINK: ${MONGODB}
      PORT: 5000
    ports:
      - 8081:5000
    networks:
      - codon_net

  cd-users:
    build:
      context: .
      dockerfile: users.Dockerfile
    depends_on:
      db:
        condition: service_started
      db-users:
        condition: service_started
      mongo:
        condition: service_started
    ports:
      - 8084:8000
    environment:
      ENV: DEV
      PORT: 8000
      MONGOLINK: ${MONGODB}
      SQLLINK_USERS_DATA: ${SQLLINK_USERS_DATA}
    volumes:
      - ./users:/users
    restart: always
    container_name: cd-users
    networks:
      - codon_net
  
  hmstasis:
    build:
      context: .
      dockerfile: hmstasis.Dockerfile
    container_name: hmstasis
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      db:
        condition: service_started
      db-users:
        condition: service_started
      mongo:
        condition: service_started
    ports:
      - 8085:80
    environment:
      ENV: DEV
      MONGOLINK: ${MONGODB}
      SQLLINK_CODON_HEALTH: ${SQLLINK_CODON_HEALTH}
    volumes:
      - ./hmstasis:/var/www/html
    networks:
      - codon_net

  # cd-homeostasis:
  #   build:
  #     context: .
  #     dockerfile: homeostasis.Dockerfile
  #   depends_on:
  #     db:
  #       condition: service_started
  #     db-users:
  #       condition: service_started
  #     mongo:
  #       condition: service_started
  #   ports:
  #     - 8085:8000
  #   environment:
  #     ENV: DEV
  #     PORT: 8000
  #     MONGOLINK: ${MONGODB}
  #     SQLLINK_USERS_DATA: ${SQLLINK_USERS_DATA}
  #     SQLLINK_CODON_HEALTH: ${SQLLINK_CODON_HEALTH}
  #   volumes:
  #     - ./homeostasis:/homeostasis
  #   restart: always
  #   container_name: cd-homeostasis
  
  cd-auth:
    image: "node:22"
    depends_on:
      db:
        condition: service_started
      db-users:
        condition: service_started
      mongo:
        condition: service_started
    container_name: cd-auth
    working_dir: /home/node/app
    volumes:
      - ./auth:/home/node/app
    command: npm run dev
    environment:
      MONGOLINK: ${MONGODB}
      PORT: 3000
      SALT: ${SALT}
      SALT2: ${SALT2}
      SQLLINK_USERS: ${SQLLINK_USERS}
    links:
      - mongo
    ports:
      - 8082:3000
    networks:
      - codon_net
  
  cd-logger:
    build:
      context: .
      dockerfile: logger.Dockerfile
    depends_on:
      db:
        condition: service_started
      db-users:
        condition: service_started
      mongo:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      ENV: DEV
    volumes:
      - ./logger:/logger
    restart: always
    container_name: cd-logger
    networks:
      - codon_net

