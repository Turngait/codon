  #   depends_on:
  #     db:
  #       condition: service_started
  #     db-users:
  #       condition: service_started
  #     mongo:
  #       condition: service_started
  #   container_name: cd-notify
  #   working_dir: /home/node/app
  #   restart: always
  #   volumes:
  #     - ./notify:/home/node/app
  #   command: npm run dev
  #   environment:
  #     - EMAIL_KEY=${EMAIL_KEY}
  #     - MAIL_URL=${MAIL_URL}
  #   networks:
  #     - codon_net

  mongo:
    image: mongo
    restart: always
    volumes: 
      - ./db/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PWD}
    container_name: cd-mongo-codon
    networks:
      - codon_net

  mongo-express:
    image: mongo-express
    depends_on:
      mongo:
        condition: service_started
    restart: always
    links:
      - mongo
    ports:
      - 8083:8081
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_NAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PWD}
      ME_CONFIG_MONGODB_SERVER: 'mongo'
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_NAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PWD}
    container_name: cd-mongo-express
    networks:
      - codon_net

  db:
    image: mysql:latest
    restart: always
    volumes: 
      - ./db/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    container_name: cd-db-codon
    networks:
      - codon_net

  db-users:
    image: mysql:latest
    restart: always
    volumes: 
      - ./db/mysql_users:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_USERS_ROOT_PASSWORD}
    container_name: cd-db-users
    networks:
      - codon_net

  myadmin-codon:
    image: phpmyadmin/phpmyadmin
    depends_on:
      db:
        condition: service_started
    restart: always
    links: 
      - db
    environment:
      PMA_HOST: db
    ports:
      - 8086:80
    container_name: cd-myadmin-codon
    networks:
      - codon_net

  myadmin_users:
    image: phpmyadmin/phpmyadmin
    depends_on:
      db-users:
        condition: service_started
    restart: always
    links: 
      - db-users
    environment:
      PMA_HOST: db-users
    ports:
      - 8087:80
    container_name: cd-codon-users
    networks:
      - codon_net
  # rmq:
  #   image: rabbitmq:3-management
  #   restart: always
  #   ports:
  #     - 15672:15672
